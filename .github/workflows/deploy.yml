
name: Chennai Weather App CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "chennai-weather-app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CI: Build and push Docker images
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker compose \
            -f chennai-weather-app/docker-compose.yml config -q

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./chennai-weather-app/backend
          push: true
          tags: rajeshcr7/chennai-weather-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./chennai-weather-app/frontend
          push: true
          tags: rajeshcr7/chennai-weather-frontend:latest

  # CD: Deploy to AWS EC2
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy Compose file to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/ec2_key \
            chennai-weather-app/docker-compose.yml \
            ec2-user@"$EC2_HOST":/home/ec2-user/docker-compose.yml

      - name: Pull images and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            ec2-user@"$EC2_HOST" 'bash -s' <<'REMOTE'
            set -e

            cd /home/ec2-user

            sudo docker compose -f docker-compose.yml pull

            sudo docker compose -f docker-compose.yml up \
              -d --remove-orphans

            sudo docker compose -f docker-compose.yml ps
          REMOTE
